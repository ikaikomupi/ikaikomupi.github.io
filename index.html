<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Font tidak menahan tampilan pertama (media=print lalu all). Fraunces italic dimuat
         terpisah hanya di halaman yang memakainya (src/lib/fontItalic.js). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&family=Hanken+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&family=Hanken+Grotesk:wght@300..700&display=swap" rel="stylesheet" />
    </noscript>
    <script>
      // Foto latar halaman ini mulai diunduh sebelum JavaScript selesai dimuat.
      (function () {
        var foto = { "/": "hero-bg", "/directory": "directory-bg" }[location.pathname.replace(/\/+$/, "") || "/"];
        if (!foto) return;
        var l = document.createElement("link");
        l.rel = "preload";
        l.as = "image";
        l.type = "image/webp";
        l.setAttribute("imagesrcset", "/img/" + foto + "-800.webp 800w, /img/" + foto + "-1600.webp 1600w");
        l.setAttribute("imagesizes", "100vw");
        l.setAttribute("fetchpriority", "high");
        document.head.appendChild(l);
      })();
    </script>
    <meta name="color-scheme" content="dark light" />
    <script>
      // Pasang tema sebelum halaman digambar supaya nggak berkedip.
      (function () {
        var t = "dark";
        try {
          t = localStorage.getItem("tema") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        } catch (e) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <title>IKA IKOM UPI · Ikatan Alumni Ilmu Komunikasi UPI</title>
    <meta name="description" content="Jejaring alumni Ilmu Komunikasi Universitas Pendidikan Indonesia: direktori alumni, event, karir, dan KOMpas ASN untuk persiapan CPNS." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IKA IKOM UPI" />
    <meta property="og:title" content="IKA IKOM UPI · Ikatan Alumni Ilmu Komunikasi UPI" />
    <meta property="og:description" content="Direktori alumni, event, karir, dan KOMpas ASN untuk persiapan CPNS alumni Ilmu Komunikasi UPI." />
    <meta property="og:url" content="https://ikaikomupi.github.io/" />
    <meta property="og:image" content="https://ikaikomupi.github.io/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
